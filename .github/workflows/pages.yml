# Publishes dist/ to GitHub Pages on every push to main.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stamp local CSS and JS links with the commit, so browsers never mix an old
      # cached page with newly published scripts.
      - name: Version asset links
        run: |
          v="${GITHUB_SHA::7}"
          sed -i -E "s#(href|src)=\"((\.\./\.\./)?[a-z0-9-]+\.(css|js))\"#\1=\"\2?v=$v\"#g" dist/*.html dist/portfolio/*/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
